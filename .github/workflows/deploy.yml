name: Sceptic CD & GHCR Publishing Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target deployment environment"
        required: true
        default: "production"
      version:
        description: "Application version semver"
        required: true
        default: "1.0.0"
      gate_override_reason:
        description: "Only for an approved override of a BLOCK or REQUEST_CHANGES gate. Min 10 characters. Logged with the approver."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  APPLICATION_VERSION: ${{ github.event.inputs.version || '1.0.0' }}
  DEPLOY_ENV: ${{ github.event.inputs.environment || 'production' }}

jobs:
  publish-and-deploy:
    name: Build, Publish to GHCR & Deploy Target Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lowercase Repository & Image Names
        id: image-names
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER_LC" >> $GITHUB_OUTPUT
          echo "backend_image=ghcr.io/$OWNER_LC/sceptic-backend" >> $GITHUB_OUTPUT
          echo "worker_image=ghcr.io/$OWNER_LC/sceptic-worker" >> $GITHUB_OUTPUT
          echo "frontend_image=ghcr.io/$OWNER_LC/sceptic-frontend" >> $GITHUB_OUTPUT
          echo "target_image=ghcr.io/$OWNER_LC/sceptic-target-service" >> $GITHUB_OUTPUT

      # -------------------------------------------------------------
      # 1. Build & Publish Immutable Docker Images to GHCR
      # -------------------------------------------------------------
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.backend_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.backend_image }}:latest

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.worker_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.worker_image }}:latest

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.frontend_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.frontend_image }}:latest

      - name: Build & Push Target Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./target_service
          file: target_service/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.target_image }}:${{ github.sha }}
            ${{ steps.image-names.outputs.target_image }}:latest

      # -------------------------------------------------------------
      # 2. Automated Deployment with Deployment Metadata
      # -------------------------------------------------------------
      - name: Set up Python for Deployment Orchestrator
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Deployment Orchestrator and Verification Dependencies
        run: |
          pip install -r worker/requirements.txt
          pip install -e .
          pip install httpx pydantic pytest

      - name: Build Blind-Tester Sandbox Image
        run: docker build -t sceptic-sandbox:latest -f worker/sandbox/Dockerfile worker

      # -------------------------------------------------------------
      # 2b. Verification Gate: audit the service being deployed
      # -------------------------------------------------------------
      - name: Install gitleaks (checksum verified)
        run: |
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Audit Target Service (Trust Gate Input)
        id: audit
        run: |
          set +e
          python -m cli.main audit target_service --json > audit-report.json
          echo "Audit exit code: $?"
          set -e
          RECOMMENDATION=$(python -c "import json; r=json.load(open('audit-report.json')).get('recommendation','BLOCK'); print(r if r in ('APPROVE','REQUEST_CHANGES','BLOCK') else 'BLOCK')")
          echo "recommendation=$RECOMMENDATION" >> "$GITHUB_OUTPUT"
          echo "Trust gate recommendation: $RECOMMENDATION"

      - name: Launch Containerized Services
        env:
          COMMIT_SHA: ${{ github.sha }}
          APPLICATION_VERSION: ${{ env.APPLICATION_VERSION }}
          ENVIRONMENT: ${{ env.DEPLOY_ENV }}
        run: |
          BUILD_TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          export BUILD_TIMESTAMP
          docker compose up -d postgres redis backend target-service

      # -------------------------------------------------------------
      # 3. Post-Deployment Health, Version & Commit Verification
      # -------------------------------------------------------------
      - name: Verify Deployment Health and Commit Identity
        env:
          SCEPTIC_PROJECT_ID: ${{ secrets.SCEPTIC_PROJECT_ID }}
          SCEPTIC_API_TOKEN: ${{ secrets.SCEPTIC_API_TOKEN }}
          GATE_OVERRIDE_REASON: ${{ inputs.gate_override_reason }}
        run: |
          python scripts/deploy.py \
            --project-id "$SCEPTIC_PROJECT_ID" \
            --api-token "$SCEPTIC_API_TOKEN" \
            --commit-sha "${{ github.sha }}" \
            --image-name "${{ steps.image-names.outputs.target_image }}" \
            --image-tag "${{ github.sha }}" \
            --environment "${{ env.DEPLOY_ENV }}" \
            --version "${{ env.APPLICATION_VERSION }}" \
            --target-url "http://localhost:8080" \
            --backend-url "http://localhost:8000" \
            --trust-recommendation "${{ steps.audit.outputs.recommendation }}" \
            --override-reason "$GATE_OVERRIDE_REASON" \
            --override-by "${{ github.actor }}" \
            --timeout 45.0

      - name: Teardown Services on Completion
        if: always()
        run: docker compose down
