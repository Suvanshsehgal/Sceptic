name: Sceptic CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-suite:
    name: Test Python Suite (Backend, Worker, CLI, Target Service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r target_service/requirements.txt
          pip install pytest-asyncio aiosqlite typer rich
          pip install -e .

      - name: Install gitleaks (checksum verified)
        run: |
          VERSION=8.30.1
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt"
          grep "gitleaks_${VERSION}_linux_x64.tar.gz" checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install osv-scanner (checksum verified)
        run: |
          VERSION=2.7.0
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner && sudo mv osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Install pinned JavaScript/TypeScript tools (tsc, Jest)
        run: npm ci --prefix worker/tools/js

      - name: Build Blind-Tester Sandbox Image
        run: docker build -t sceptic-sandbox:latest -f worker/sandbox/Dockerfile worker

      - name: Run Pytest Suite
        run: |
          pytest target_service/ worker/ cli/ backend/ -v --tb=short

  build-frontend:
    name: Build & Validate Frontend (React + Vite + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  validate-docker:
    name: Validate Docker Compose & Image Builds
    needs: [test-python-suite, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose File Syntax
        run: |
          docker compose config --quiet
          docker compose -f infra/docker-compose.prod.yml config --quiet

      - name: Build Backend Image
        run: docker build -t sceptic-backend:ci -f backend/Dockerfile .

      - name: Build Celery Worker Image
        run: docker build -t sceptic-worker:ci -f worker/Dockerfile .

      - name: Build Frontend Image
        run: docker build -t sceptic-frontend:ci -f frontend/Dockerfile ./frontend

      - name: Build Target Service Image
        run: docker build -t sceptic-target-service:ci -f target_service/Dockerfile ./target_service
