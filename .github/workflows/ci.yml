name: Sceptic CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-suite:
    name: Test Python Suite (Backend, Worker, CLI, Target Service)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc build-essential libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r target_service/requirements.txt
          pip install pytest-asyncio aiosqlite typer rich
          pip install -e .

      - name: Run Pytest Suite
        run: |
          pytest target_service/ worker/ cli/ backend/ -v --tb=short

  build-frontend:
    name: Build & Validate Frontend (React + Vite + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  validate-docker:
    name: Validate Docker Compose & Image Builds
    needs: [test-python-suite, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose File Syntax
        run: |
          docker compose config --quiet
          docker compose -f infra/docker-compose.prod.yml config --quiet

      - name: Build Backend Image
        run: docker build -t sceptic-backend:ci -f backend/Dockerfile .

      - name: Build Celery Worker Image
        run: docker build -t sceptic-worker:ci -f worker/Dockerfile .

      - name: Build Frontend Image
        run: docker build -t sceptic-frontend:ci -f frontend/Dockerfile ./frontend

      - name: Build Target Service Image
        run: docker build -t sceptic-target-service:ci -f target_service/Dockerfile ./target_service
