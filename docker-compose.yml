services:
  postgres:
    image: postgres:15-alpine
    container_name: sceptic-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sceptic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sceptic_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sceptic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sceptic} -d ${POSTGRES_DB:-sceptic}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sceptic-network

  redis:
    image: redis:7-alpine
    container_name: sceptic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sceptic-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sceptic-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sceptic:sceptic_password_dev@postgres:5432/sceptic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sceptic-network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: sceptic-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sceptic:sceptic_password_dev@postgres:5432/sceptic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sceptic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sceptic-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sceptic-network

  target-service:
    build:
      context: ./target_service
      dockerfile: Dockerfile
    container_name: sceptic-target-service
    restart: unless-stopped
    ports:
      - "${TARGET_SERVICE_PORT:-8080}:8080"
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-dev-initial}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-2026-10-07T00:00:00Z}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sceptic-network

networks:
  sceptic-network:
    name: sceptic-network
    driver: bridge

volumes:
  postgres_data:
    name: sceptic_postgres_data
