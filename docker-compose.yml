services:
  postgres:
    image: postgres:15-alpine
    container_name: sceptic-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sceptic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sceptic_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sceptic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sceptic} -d ${POSTGRES_DB:-sceptic}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sceptic-network

  redis:
    image: redis:7-alpine
    container_name: sceptic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sceptic-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sceptic-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sceptic:sceptic_password_dev@postgres:5432/sceptic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sceptic-network

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: sceptic-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sceptic:sceptic_password_dev@postgres:5432/sceptic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sceptic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sceptic-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sceptic-network

  target-service:
    build:
      context: ./target_service
      dockerfile: Dockerfile
    container_name: sceptic-target-service
    restart: unless-stopped
    ports:
      - "${TARGET_SERVICE_PORT:-8080}:8080"
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-dev-initial}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-2026-10-07T00:00:00Z}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - sceptic-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sceptic-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      target-service:
        condition: service_healthy
    networks:
      - sceptic-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sceptic-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards/definitions:/etc/grafana/provisioning/dashboards/definitions:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sceptic-network

networks:
  sceptic-network:
    name: sceptic-network
    driver: bridge

volumes:
  postgres_data:
    name: sceptic_postgres_data
  prometheus_data:
    name: sceptic_prometheus_data
  grafana_data:
    name: sceptic_grafana_data
