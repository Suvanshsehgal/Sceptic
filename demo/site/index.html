<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Shop</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0c0d0f; color: #e8e9ec; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #24272d; background: #131417; }
    header h1 { font-size: 18px; margin: 0; }
    main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
    .badge { font-family: ui-monospace, Consolas, monospace; font-size: 12px; padding: 4px 10px; border-radius: 999px; background: #1a1c20; }
    .ok { color: #6fd39a; } .bad { color: #ef7a7a; } .warn { color: #e8c170; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .toolbar p { margin: 0; color: #9aa0aa; font-size: 14px; }
    button { font: inherit; font-size: 14px; color: #0c0d0f; background: #f2f2f4; border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
    button.secondary { color: #e8e9ec; background: #1a1c20; border: 1px solid #2c3038; font-weight: 500; }
    button:disabled { opacity: .5; cursor: wait; }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .card { background: #131417; border: 1px solid #24272d; border-radius: 12px; padding: 16px; }
    .card .name { font-weight: 600; font-size: 15px; }
    .card .meta { color: #9aa0aa; font-size: 13px; margin-top: 4px; }
    .card .price { font-family: ui-monospace, Consolas, monospace; margin-top: 12px; font-size: 15px; }
    .notice { border: 1px solid #5a2a2a; background: #1d1414; color: #f3b3b3; border-radius: 10px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; display: none; }
    .empty { color: #9aa0aa; font-size: 14px; padding: 24px 0; }
  </style>
</head>
<body>
<header>
  <h1>Demo Shop</h1>
  <span class="badge" id="health">checking…</span>
</header>

<main>
  <div class="toolbar">
    <p>Orders are served by <code>/api/orders</code>. Break the service from the control panel and reload to see the effect.</p>
    <div style="display:flex; gap:8px;">
      <button class="secondary" id="refresh">Refresh</button>
      <button id="checkout">Place an order</button>
    </div>
  </div>

  <div class="notice" id="notice" role="alert"></div>
  <div id="orders" class="grid" aria-live="polite"></div>
  <p class="empty" id="empty" style="display:none">No orders yet. Place one to get started.</p>
</main>

<script>
  const $ = (id) => document.getElementById(id);

  const showNotice = (message) => {
    const el = $('notice');
    el.textContent = message;
    el.style.display = message ? 'block' : 'none';
  };

  const money = (n) => `$${Number(n).toFixed(2)}`;

  async function checkHealth() {
    const el = $('health');
    try {
      const res = await fetch('/health');
      const ok = res.ok;
      el.textContent = ok ? 'service healthy' : `health HTTP ${res.status}`;
      el.className = 'badge ' + (ok ? 'ok' : 'bad');
    } catch (e) {
      el.textContent = 'service unreachable';
      el.className = 'badge bad';
    }
  }

  function render(orders) {
    const list = $('orders');
    list.innerHTML = '';
    $('empty').style.display = orders.length ? 'none' : 'block';
    orders.slice().reverse().forEach((o) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="name"></div>
        <div class="meta"></div>
        <div class="price"></div>`;
      card.querySelector('.name').textContent = o.item;
      card.querySelector('.meta').textContent = `Order #${o.id}`;
      card.querySelector('.price').textContent = money(o.total);
      list.appendChild(card);
    });
  }

  async function loadOrders() {
    try {
      const res = await fetch('/api/orders');
      if (!res.ok) throw new Error(`The shop returned HTTP ${res.status}. The service is failing requests right now.`);
      const data = await res.json();
      showNotice('');
      render(data.orders);
    } catch (e) {
      showNotice(e.message || 'Could not load orders.');
      $('orders').innerHTML = '';
      $('empty').style.display = 'none';
    }
  }

  async function placeOrder(btn) {
    btn.disabled = true;
    try {
      const res = await fetch('/api/checkout', { method: 'POST' });
      if (!res.ok) throw new Error(`Order failed with HTTP ${res.status}. Try again.`);
      showNotice('');
      await loadOrders();
    } catch (e) {
      showNotice(e.message || 'Order failed.');
    } finally {
      btn.disabled = false;
    }
  }

  $('refresh').addEventListener('click', () => { loadOrders(); checkHealth(); });
  $('checkout').addEventListener('click', (e) => placeOrder(e.currentTarget));

  loadOrders();
  checkHealth();
  setInterval(() => { loadOrders(); checkHealth(); }, 5000);
</script>
</body>
</html>
