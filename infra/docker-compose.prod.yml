# Sceptic Production-Like Multi-Container Compose Environment
# Reflects core production topology without external cloud/k8s infrastructure.

services:
  postgres:
    image: postgres:15-alpine
    container_name: sceptic-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sceptic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sceptic_prod_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sceptic}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sceptic} -d ${POSTGRES_DB:-sceptic}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  redis:
    image: redis:7-alpine
    container_name: sceptic-redis-prod
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: sceptic-backend-prod
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sceptic:sceptic_prod_secure_password@postgres:5432/sceptic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  worker:
    build:
      context: ..
      dockerfile: worker/Dockerfile
    container_name: sceptic-worker-prod
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://sceptic:sceptic_prod_secure_password@postgres:5432/sceptic}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sceptic-frontend-prod
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  target-service:
    build:
      context: ../target_service
      dockerfile: Dockerfile
    container_name: sceptic-target-service-prod
    restart: always
    ports:
      - "${TARGET_SERVICE_PORT:-8080}:8080"
    environment:
      APPLICATION_VERSION: ${APPLICATION_VERSION:-1.0.0}
      COMMIT_SHA: ${COMMIT_SHA:-prod-release}
      BUILD_TIMESTAMP: ${BUILD_TIMESTAMP:-2026-10-07T00:00:00Z}
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: sceptic-prometheus-prod
    restart: always
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_prod_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      target-service:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: sceptic-grafana-prod
    restart: always
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards/definitions:/etc/grafana/provisioning/dashboards/definitions:ro
      - grafana_prod_data:/var/lib/grafana
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - sceptic-prod-network

networks:
  sceptic-prod-network:
    name: sceptic-prod-network
    driver: bridge

volumes:
  postgres_prod_data:
    name: sceptic_postgres_prod_data
  redis_prod_data:
    name: sceptic_redis_prod_data
  prometheus_prod_data:
    name: sceptic_prometheus_prod_data
  grafana_prod_data:
    name: sceptic_grafana_prod_data
